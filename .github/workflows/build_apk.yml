name: Build Android APK

on:
  push:
    branches: [ main, dylandeam/dev ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Validate API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: test -n "$API_BASE_URL" && [[ "$API_BASE_URL" == https://* ]]

      - name: Build APK for QA
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-nutrisalud-qa
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
